<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Juba que Prevê — Sistema de Previsão do Tempo">
  <title>A Juba que Prevê</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>">

  <!-- Estilos -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Ponto de montagem da aplicação -->
  <div id="app">
    <!-- Loading inicial -->
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a12;color:#9090b8;flex-direction:column;gap:1rem;font-family:'Segoe UI',sans-serif">
      <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#f7c948,#f7a52a);display:flex;align-items:center;justify-content:center;font-size:2rem;animation:spin .7s linear infinite">🦁</div>
      <p style="font-size:.9rem;letter-spacing:2px;text-transform:uppercase">A carregar...</p>
    </div>
  </div>

  <!-- i18n -->
  <script src="i18n/pt.js"></script>
  <script src="i18n/en.js"></script>

  <!-- Serviços (dependências primeiro) -->
  <script src="services/auth.js"></script>
  <script src="services/api.js"></script>

  <!-- Componentes reutilizáveis -->
  <script src="components/modal.js"></script>
  <script src="components/weather-card.js"></script>

  <!-- Lógica principal -->
  <script src="assets/js/app.js"></script>

</html>
